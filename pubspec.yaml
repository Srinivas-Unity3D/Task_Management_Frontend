name: taskmanagement
description: "internal team task management tool"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  intl_phone_number_input: ^0.7.3
  http: ^1.1.0
  shared_preferences: ^2.2.2
  record: ^5.0.4
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  file_picker: ^10.1.2
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  intl: ^0.18.1
  open_file: ^3.3.2
  uuid: ^4.2.1
  timeago: ^3.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/